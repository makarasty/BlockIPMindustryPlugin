apply plugin: "java"

version '1.0'

sourceSets.main.java.srcDirs = ["src"]
sourceSets.test.java.srcDirs = ["test"]

repositories {
    mavenCentral()
    // The server jar from Mindustry's GitHub releases: the build the fleet runs, not a jitpack snapshot
    ivy {
        url = uri("https://github.com/")
        patternLayout {
            artifact "/[organisation]/[module]/releases/download/[revision]/[artifact].[ext]"
        }
        metadataSources { artifact() }
        content { includeModule("Anuken", "Mindustry") }
    }
}

ext {
    mindustryVersion = project.hasProperty('mindustryVersion') ? project.getProperty('mindustryVersion') : 'v159.7'
}

dependencies {
    compileOnly "Anuken:Mindustry:$mindustryVersion"
    implementation 'com.maxmind.db:maxmind-db:4.0.0'

    testImplementation "Anuken:Mindustry:$mindustryVersion"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

test {
    useJUnitPlatform()
}

jar {
    archiveFileName = "${project.archivesBaseName}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    from(rootDir) {
        include "plugin.json"
    }
}
